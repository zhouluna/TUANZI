name: Build desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Check Python behavior
        run: python -m unittest discover -s tests -v
      - name: Build and run bundled self-check
        run: python scripts/build_release.py
      - name: Verify graphical app and single-instance commands
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v6
        with:
          name: Tuanzi-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
